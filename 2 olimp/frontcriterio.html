<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Criterios - Panel de Jurados</title>


    <!-- 1. Cargar la librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="csscriterio.css">
   

</head>
<body>
     <div id="header-placeholder"></div>

<div class="container">
    <h2>Guía de Criterios de Evaluación</h2>
    <p class="subtitle">Parámetros oficiales obtenidos desde la base de datos para el jurado.</p>

    <!-- Botones para filtrar por año -->
    <div style="margin-bottom: 20px;">
        <button onclick="cargarCriterios(4)" class="btn-filtro">Ver 4°,5° y 6° Año</button>
        <button onclick="cargarCriterios(7)" class="btn-filtro">Ver 7° Año</button>
    </div>

    <div id="mensaje">Cargando criterios...</div>
    <div id="criteriosContainer" class="criterios-grid"></div>
</div>

<script>
   // Configuración de credenciales de Supabase
const SUPABASE_URL = 'https://mcoxfiwmmcfughfybxij.supabase.co';
const SUPABASE_KEY = 'sb_publishable_izeEOV-__s9okF5yJMsMGw_-QNYnh7h';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Función principal para cargar y filtrar por año
async function cargarCriterios(anioSeleccionado) {
    const mensajeBox = document.getElementById('mensaje');
    const contenedor = document.getElementById('criteriosContainer');
    
    // Limpiar el contenedor anterior y mostrar mensaje de carga
    contenedor.innerHTML = '';
    mensajeBox.style.display = 'block';
    mensajeBox.style.background = '#e2e3e5';
    mensajeBox.style.color = '#383d41';
    mensajeBox.innerText = `Cargando criterios de ${anioSeleccionado}° año...`;

    try {
        // Consulta a Supabase filtrando por el año recibido
        const { data: criteriosData, error } = await supabaseClient
            .from('criterios')
            .select('*')
            .eq('año', anioSeleccionado) // <--- Aquí se aplica el filtro por año
            .order('id_criterios', { ascending: true });

        if (error) {
            mensajeBox.style.background = '#f8d7da';
            mensajeBox.style.color = '#721c24';
            mensajeBox.innerText = 'Error de Supabase: ' + error.message;
            return;
        }

        if (!criteriosData || criteriosData.length === 0) {
            mensajeBox.style.background = '#fff3cd';
            mensajeBox.style.color = '#856404';
            mensajeBox.innerText = `No hay criterios cargados para el año ${anioSeleccionado}.`;
            return;
        }

        // Ocultar mensaje si todo salió bien
        mensajeBox.style.display = 'none';

        // Pintar las tarjetas en pantalla
        criteriosData.forEach((item, index) => {
            const numeroCriterio = index + 1;
            
            const tarjeta = document.createElement('div');
            tarjeta.className = 'criterio-card';
            tarjeta.innerHTML = `
                <div class="criterio-header">Criterio ${numeroCriterio} </div> <!--(Año: ${item.año})-->
                <div class="criterio-desc"><strong>Descripción:</strong> ${item.criterio}</div>
                ${item.proyecto ? `<div class="criterio-proyecto"><strong>Proyecto/Detalle:</strong> ${item.proyecto}</div>` : ''}
            `;
            contenedor.appendChild(tarjeta);
        });

    } catch (err) {
        console.error("Excepción atrapada:", err);
        mensajeBox.style.background = '#f8d7da';
        mensajeBox.style.color = '#721c24';
        mensajeBox.innerText = 'Ocurrió un error inesperado: ' + err.message;
    }
}

// Opcional: Cargar por defecto el año 4 al abrir la página por primera vez
window.addEventListener('DOMContentLoaded', function() {
    cargarCriterios(4);
});
</script>
    <script src="main.js"></script>
</body>
</html>
