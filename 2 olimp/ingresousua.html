<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso con Supabase</title>
    <!-- 1. Cargar la librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <link rel="stylesheet" href="cssingreso.css">
</head>
<body>
        
    <div class="caja">
        <h2>Iniciar Sesión</h2>
        
        <!-- Formulario de Acceso -->
        <form id="formLogin">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>

            <button type="submit">Entrar</button>
        </form>

        <p id="mensaje"></p>
    </div>

    <script>
        // 2. Configurar tus credenciales de Supabase
        const SUPABASE_URL = 'https://mcoxfiwmmcfughfybxij.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_izeEOV-__s9okF5yJMsMGw_-QNYnh7h';

        // Inicializar el cliente de Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 3. Manejar el evento de inicio de sesión
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault(); // Evita que la página se recargue

            const emailInput = document.getElementById('email').value;
            const passwordInput = document.getElementById('password').value;
            const mensajeBox = document.getElementById('mensaje');

            mensajeBox.style.color = 'blue';
            mensajeBox.innerText = 'Verificando credenciales...';

            // Consultar a Supabase para autenticar al usuario
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailInput,
                password: passwordInput,
            });

            if (error) {
                mensajeBox.style.color = 'red';
                mensajeBox.innerText = 'Error de acceso: ' + error.message;
            } else {
                mensajeBox.style.color = 'green';
                mensajeBox.innerText = '¡Acceso exitoso! Bienvenido, ' + data.user.email;
                
                // Aquí puedes redirigirlo a otra página o cambiar la vista de tu HTML
                localStorage.setItem('sesionActiva', 'true');
                
                               

// 3. Consultas la tabla 'alumnos' para ver si ese correo existe ahí
const { data: alumnoData, error: alumnoError } = await supabaseClient
    .from('alumnos')
    .select('id_alumno')
    .eq('correo', emailInput)
    .single();

// 4. Validas el resultado
if (alumnoData) {
    // Si 'alumnoData' trae información, significa que SÍ es un alumno
    window.location.href = 'frontestud.html';
} else {
    // Si no está en la tabla de alumnos, puede ser un profesor, admin o un usuario general
    window.location.href = 'frontnotagrup.html'; // (o la página que corresponda)
}

               
            }
        });
    </script>
       
</body>
</html>
