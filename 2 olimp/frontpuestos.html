
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clasificación de eventos</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="cssfrontpuestos.css">
</head>

<body>

    <div id="header-placeholder"></div>

    <main class="contenedor-principal">

        <h2>Clasificación de puntuaciones</h2>

        <div class="filtros">

            <div class="campo">
                <label for="evento">Seleccionar evento</label>

                <select id="evento">
                    <option value="">Cargando eventos...</option>
                </select>
            </div>

            <div class="campo">
                <label for="anio">Filtrar por año</label>

                <select id="anio" disabled>
                    <option value="">Todos los años</option>
                </select>
            </div>

        </div>

        <p id="estado">Conectando con Supabase...</p>

        <h3 id="tituloClasificacion"></h3>

        <div class="tabla-contenedor">

            <table>

                <thead id="cabecera">
                    <tr>
                        <th>Criterio</th>
                        <th>Grupos</th>
                    </tr>
                </thead>

                <tbody id="clasificacion">
                    <tr>
                        <td colspan="2">Esperando datos...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </main>


    <script>

        // ==========================================
        // 1. CONEXIÓN A SUPABASE
        // ==========================================

        const SUPABASE_URL =
            'https://mcoxfiwmmcfughfybxij.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_izeEOV-__s9okF5yJMsMGw_-QNYnh7h';

        const cliente = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        // ==========================================
        // 2. OBTENER ELEMENTOS DEL HTML
        // ==========================================

        const selectorEvento = document.getElementById("evento");

        const selectorAnio = document.getElementById("anio");

        const cabecera = document.getElementById("cabecera");

        const cuerpoTabla = document.getElementById("clasificacion");

        const estado = document.getElementById("estado");

        const titulo = document.getElementById("tituloClasificacion");


        // ==========================================
        // 3. FUNCIONES AUXILIARES
        // ==========================================

        // Crear una celda dentro de una fila.

        function agregarCelda(fila, texto, esCabecera = false) {

            const celda = document.createElement(
                esCabecera ? "th" : "td"
            );

            celda.textContent = texto;

            fila.appendChild(celda);
        }


        // Mostrar errores.

        function mostrarError(mensaje) {

            estado.textContent = mensaje;

            titulo.textContent = "";

            cuerpoTabla.replaceChildren();
        }


        // ==========================================
        // 4. GENERAR CABECERA DE LA TABLA
        // ==========================================

        function generarCabecera(grupos) {

            const fila = document.createElement("tr");

            agregarCelda(fila, "Criterio", true);

            grupos.forEach(grupo => {

                agregarCelda(
                    fila,
                    grupo.nombre,
                    true
                );

            });

            cabecera.replaceChildren(fila);
        }


        // ==========================================
        // 5. CARGAR EVENTOS
        // ==========================================

        async function cargarEventos() {

            estado.textContent = "Cargando eventos...";

            const { data, error } = await cliente
                .from("eventos")
                .select("id_eventos, nombre")
                .order("id_eventos");

            if (error) {

                mostrarError(
                    "Error al cargar eventos: " + error.message
                );

                return;
            }

            selectorEvento.replaceChildren();

            const inicial = document.createElement("option");

            inicial.value = "";

            inicial.textContent = "Selecciona un evento";

            selectorEvento.appendChild(inicial);


            (data || []).forEach(evento => {

                const opcion = document.createElement("option");

                opcion.value = evento.id_eventos;

                opcion.textContent =
                    `${evento.nombre} (ID: ${evento.id_eventos})`;

                selectorEvento.appendChild(opcion);

            });


            estado.textContent = data.length
                ? "Selecciona un evento para ver su clasificación."
                : "No hay eventos registrados.";
        }


        // ==========================================
        // 6. CARGAR AÑOS DISPONIBLES
        // ==========================================

        async function cargarAnios(idEvento) {

            selectorAnio.disabled = true;

            selectorAnio.replaceChildren();

            const todos = document.createElement("option");

            todos.value = "";

            todos.textContent = "Todos los años";

            selectorAnio.appendChild(todos);


            const { data, error } = await cliente
                .from("grupos")
                .select("año")
                .eq("id_eventos", idEvento)
                .not("año", "is", null)
                .order("año");

            if (error) throw error;


            const anios = [
                ...new Set(
                    (data || []).map(g => String(g.año))
                )
            ].sort((a, b) =>
                a.localeCompare(b, undefined, { numeric: true })
            );


            anios.forEach(anio => {

                const opcion = document.createElement("option");

                opcion.value = anio;

                opcion.textContent = anio;

                selectorAnio.appendChild(opcion);

            });

            selectorAnio.disabled = false;
        }


        // ==========================================
        // 7. EVENTO: CAMBIAR EVENTO
        // ==========================================

        selectorEvento.addEventListener("change", async () => {

            const idEvento = selectorEvento.value;

            titulo.textContent = "";

            cuerpoTabla.replaceChildren();

            if (!idEvento) {

                selectorAnio.disabled = true;

                estado.textContent = "Selecciona un evento.";

                return;
            }


            try {

                await cargarAnios(idEvento);

                selectorAnio.value = "";

                await cargarClasificacion(idEvento);

            } catch (error) {

                mostrarError("Error: " + error.message);

            }

        });


        // ==========================================
        // 8. EVENTO: CAMBIAR AÑO
        // ==========================================

        selectorAnio.addEventListener("change", async () => {

            if (selectorEvento.value) {

                await cargarClasificacion(
                    selectorEvento.value
                );

            }

        });


        // ==========================================
        // 9. CARGAR Y CALCULAR CLASIFICACIÓN
        // ==========================================

        async function cargarClasificacion(idEvento) {

            estado.textContent = "Cargando clasificación...";

            titulo.textContent = "";

            cuerpoTabla.replaceChildren();


            try {

                // ----------------------------------
                // PASO 1: OBTENER LOS GRUPOS
                // ----------------------------------

                let consultaGrupos = cliente
                    .from("grupos")
                    .select("id_grupos, nombre, año")
                    .eq("id_eventos", idEvento);


                if (selectorAnio.value !== "") {

                    consultaGrupos = consultaGrupos.eq(
                        "año",
                        selectorAnio.value
                    );

                }


                const { data: grupos, error: errorGrupos } =
                    await consultaGrupos;

                if (errorGrupos) throw errorGrupos;


                // ----------------------------------
                // PASO 2: OBTENER LOS CRITERIOS
                // ----------------------------------

                let consultaCriterios = cliente
                    .from("criterios")
                    .select("id_criterios, Max_puntos, criterio, año")
                    .order("id_criterios");


                if (selectorAnio.value !== "") {

                    consultaCriterios = consultaCriterios.eq(
                        "año",
                        selectorAnio.value
                    );

                }


                const { data: criterios, error: errorCriterios } =
                    await consultaCriterios;

                if (errorCriterios) throw errorCriterios;


                // ----------------------------------
                // PASO 3: VERIFICAR DATOS
                // ----------------------------------

                if (!grupos || grupos.length === 0) {

                    estado.textContent =
                        "No hay grupos para este evento y año.";

                    return;
                }


                if (!criterios || criterios.length === 0) {

                    estado.textContent =
                        "No hay criterios registrados para este año.";

                    return;
                }


                // ----------------------------------
                // PASO 4: OBTENER LAS NOTAS
                // ----------------------------------

                const idsGrupos = grupos.map(g => g.id_grupos);


                const { data: notas, error: errorNotas } =
                    await cliente
                        .from("notas")
                        .select("id_grupos, id_criterios, nota")
                        .in("id_grupos", idsGrupos);


                if (errorNotas) throw errorNotas;


                // ----------------------------------
                // PASO 5: CALCULAR LAS PUNTUACIONES
                // ----------------------------------

                const resultados = grupos.map(grupo => {

                    const puntuaciones = {};


                    // Inicializar todos los criterios.

                    criterios.forEach(criterio => {

                        puntuaciones[
                            String(criterio.id_criterios)
                        ] = null;

                    });


                    // Obtener las notas del grupo.

                    const notasGrupo = (notas || []).filter(nota =>

                        String(nota.id_grupos) ===
                        String(grupo.id_grupos)

                    );


                    // Guardar las puntuaciones.

                    notasGrupo.forEach(nota => {

                        const idCriterio =
                            String(nota.id_criterios);


                        const criterio = criterios.find(c =>

                            String(c.id_criterios) === idCriterio

                        );


                        if (!criterio) return;


                        const puntos = Number(nota.nota);

                        const maximo = Number(criterio.Max_puntos);


                        // Validar las notas.

                        if (
                            nota.nota === null ||
                            nota.nota === undefined ||
                            nota.nota === "" ||
                            !Number.isFinite(puntos) ||
                            !Number.isFinite(maximo) ||
                            maximo <= 0 ||
                            puntos < 0 ||
                            puntos > maximo
                        ) {

                            return;

                        }


                        puntuaciones[idCriterio] = puntos;

                    });


                    // ----------------------------------
                    // PASO 6: CALCULAR EL TOTAL
                    // ----------------------------------

                    const valores = Object.values(puntuaciones);


                    // Comprobar si todas las notas están completas.

                    const completo = valores.every(valor =>
                        valor !== null
                    );


                    // Sumar las puntuaciones originales.

                    const total = completo

                        ? valores.reduce(
                            (suma, valor) => suma + valor,
                            0
                        )

                        : null;


                    return {

                        id: grupo.id_grupos,

                        nombre: grupo.nombre,

                        anio: grupo.año,

                        puntuaciones,

                        total

                    };

                });


                // ----------------------------------
                // PASO 7: ORDENAR LOS GRUPOS
                // ----------------------------------

                resultados.sort((a, b) => {

                    // Los grupos incompletos quedan al final.

                    if (
                        a.total === null &&
                        b.total === null
                    ) {

                        return a.nombre.localeCompare(b.nombre);

                    }


                    if (a.total === null) return 1;

                    if (b.total === null) return -1;


                    // Mayor puntuación primero.

                    return b.total - a.total ||

                        a.nombre.localeCompare(b.nombre);

                });


                // ----------------------------------
                // PASO 8: GENERAR LA CABECERA
                // ----------------------------------

                generarCabecera(resultados);


                // ----------------------------------
                // PASO 9: GENERAR EL TÍTULO
                // ----------------------------------

                const opcionEvento =
                    selectorEvento.options[
                        selectorEvento.selectedIndex
                    ];


                titulo.textContent =

                    "Clasificación: " +
                    opcionEvento.textContent +

                    (selectorAnio.value

                        ? " — Año: " + selectorAnio.value

                        : " — Todos los años");


                // ----------------------------------
                // PASO 10: GENERAR LAS FILAS
                // ----------------------------------

                cuerpoTabla.replaceChildren();


                criterios.forEach(criterio => {

                    const fila = document.createElement("tr");


                    // Nombre del criterio.

                    agregarCelda(
                        fila,

                        criterio.criterio ||

                        "Criterio " + criterio.id_criterios
                    );


                    // Puntuación de cada grupo.

                    resultados.forEach(grupo => {

                        const puntos =

                            grupo.puntuaciones[
                                String(criterio.id_criterios)
                            ];


                        agregarCelda(

                            fila,

                            puntos === null

                                ? "—"

                                : puntos

                        );

                    });


                    cuerpoTabla.appendChild(fila);

                });


                // ----------------------------------
                // PASO 11: FILA DE TOTALES
                // ----------------------------------

                const filaTotal =
                    document.createElement("tr");


                filaTotal.classList.add("fila-total");


                agregarCelda(
                    filaTotal,
                    "PUNTAJE TOTAL OBTENIDO"
                );


                resultados.forEach(grupo => {

                    agregarCelda(

                        filaTotal,

                        grupo.total === null

                            ? "Incompleto"

                            : grupo.total

                    );

                });


                cuerpoTabla.appendChild(filaTotal);


                // ----------------------------------
                // PASO 12: FINALIZAR
                // ----------------------------------

                estado.textContent =

                    "Clasificación calculada correctamente. " +

                    resultados.length +

                    " grupos.";


            } catch (error) {

                console.error(
                    "Error de clasificación:",
                    error
                );


                mostrarError(
                    "Error al consultar los datos: " +
                    error.message
                );

            }

        }


        // ==========================================
        // 10. INICIAR EL SISTEMA
        // ==========================================

        cargarEventos();

    </script>


    <script src="main.js"></script>

</body>

</html>
