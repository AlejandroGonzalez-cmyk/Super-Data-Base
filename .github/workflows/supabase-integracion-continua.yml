name: Supabase CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  test-migrations:
    runs-on: windows-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instalar la CLI de Supabase sin necesidad de iniciar sesión
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # 3. Validar las migraciones levantando un entorno local (requiere Docker instalado en el runner)
      - name: Start local Supabase and verify migrations
        run: |
          supabase db start
