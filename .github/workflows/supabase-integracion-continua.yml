name: Deploy Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Aplicar migraciones pendientes
      env:
        DATABASE_URL: ${{ secrets.DB_URL }}
      run: |
        echo "Conectando a Supabase..."
        
        # 1. Crear la tabla de control si no existe
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS public.mis_migraciones_ejecutadas (
            version VARCHAR(255) PRIMARY KEY,
            aplicado_en TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
        "

        # 2. Recorrer archivos SQL en orden alfabético
        for archivo in $(ls supabase/migrations/*.sql | sort); do
          nombre_archivo=$(basename "$archivo")
          
          # Verificar si ya se aplicó antes
          ya_existe=$(psql "$DATABASE_URL" -tAn -c "SELECT 1 FROM public.mis_migraciones_ejecutadas WHERE version='$nombre_archivo';")
          
          if [ "$ya_existe" != "1" ]; then
            echo "🚀 Aplicando nueva migración: $nombre_archivo"
            
            # Ejecutar el archivo SQL
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$archivo"
            
            # Registrar que ya se ejecutó con éxito
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.mis_migraciones_ejecutadas (version) VALUES ('$nombre_archivo');"
          else
            echo "✅ $nombre_archivo ya fue aplicada anteriormente. Saltando..."
          fi
        done
        
        echo "¡Proceso terminado exitosamente!"
